[package]
name = "disk_analyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.29"
rfd = "0.15"          # нативный диалог выбора папки
rayon = "1.10"         # многопоточность для быстрого сканирования
open = "5.3"           # открытие файлов/папок в ОС

# Профиль релиза для максимальной скорости
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true